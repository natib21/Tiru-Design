name: Test

on:
  push:
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Docker test stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            --env-file .env.test \
            up --build --abort-on-container-exit --exit-code-from api
