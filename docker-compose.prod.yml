services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: prod
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://tirudesign:tirudesign_dev_password@postgres:5432/tirudesign}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
      target: prod
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4001}

  backoffice:
    build:
      context: .
      dockerfile: ./apps/backoffice/Dockerfile
      target: prod
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4001}
